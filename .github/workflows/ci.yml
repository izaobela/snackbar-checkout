name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv export --no-dev --no-hashes --format requirements-txt -o /tmp/requirements.txt
      - run: uvx pip-audit -r /tmp/requirements.txt --no-deps

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  native:
    # The README's "Run it without Docker", command for command, on Linux and macOS.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make install
      - run: make check
      - run: cd web && npm run build
      - name: make dev answers on both ports and takes a counter command
        run: |
          make dev > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8420/api/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:8420/api/health
          for i in $(seq 1 30); do curl -fsS http://localhost:5180/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:5180/ | head -c 120
          (cd api && uv run python -m app.manage price flat-white 500)
          curl -fsS http://localhost:8420/api/menu | grep -q 'price_cents":500'
          pkill -f uvicorn || true
          pkill -f vite || true
      - run: cat dev.log
        if: always()

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: curl -fsS http://localhost:8420/api/health
      - run: curl -fsS http://localhost:8420/api/menu | head -c 300
      - run: docker compose exec -T kiosk python -m app.manage price flat-white 500
      - run: curl -fsS http://localhost:8420/api/menu | grep -q 'price_cents":500'
      - run: docker compose logs --no-color | tail -n 40
        if: always()
      - run: docker compose down -v
        if: always()
