[project]
name = "snackbar-api"
version = "0.1.0"
description = "API for the snack bar self-service checkout"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "pydantic>=2",
    "starlette>=1",
    "uvicorn>=0.34",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx2>=2.15.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
